# Deploy Cloudflare Worker + apply D1 migrations from GitHub (no local wrangler required).
#
# One-time GitHub repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — API Token with: Workers Scripts:Edit, D1:Edit, (Account) Workers KV Storage:Edit if needed
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard → Workers overview (Account ID in sidebar)
# Optional:
#   LICENSE_API_SECRET     — If set, synced to Worker as LICENSE_API_SECRET on each deploy (Bearer token for /v1/entitlement)
#
# Commit a real D1 database_id in cloudflare/wrangler.toml (create DB once in Cloudflare dashboard → D1 → copy ID).

name: Deploy license API (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-license-api.yml"

concurrency:
  group: deploy-license-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package.json

      - name: Install dependencies
        run: npm install

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: d1 migrations apply rootrecord_license --remote

      - name: Put LICENSE_API_SECRET (optional)
        if: ${{ secrets.LICENSE_API_SECRET != '' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "${{ secrets.LICENSE_API_SECRET }}" | npx wrangler secret put LICENSE_API_SECRET

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
